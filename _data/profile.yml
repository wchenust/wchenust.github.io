about: >-
  I am currently a Research Assistant Professor (RAP) at the <a href="https://www.cityu.edu.hk/hkai-sci/">Hong Kong Institute of AI for Science</a> at the <a href="https://www.cityu.edu.hk/">City University of Hong Kong (CityUHK)</a>. I received my PhD from <a href="https://hkust.edu.hk/">The Hong Kong University of Science and Technology (HKUST)</a>, under the supervision of <a href="https://cse.hkust.edu.hk/~jamesk/">Prof. James Kwok</a>. I am a recipient of the Hong Kong PhD Fellowship Scheme (HKPFS).

research_interests: >-
  I am broadly focused on developing efficient and controllable machine learning models, with an interest in applying these methods to AI for Science. My current research topics include:
  <ul>
  <li>Diffusion Large Language Models (dLLM)</li>
  <li>Efficient LLM (e.g., low-rank adaptation, model merging and pruning)</li>
  <li>Multi-Objective Deep Learning</li>
  </ul>

collaboration: >-
  <strong>I am actively recruiting PhD students, visiting students, and research assistants.</strong> If you are interested in working with me, please feel free to reach out.

